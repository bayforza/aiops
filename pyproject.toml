[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-copilot"
version = "0.2.0"
description = "Local, read-only AIOps incident copilot: RCA with a local LLM and GitOps pull requests"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "drain3>=0.9.11",
  "kubernetes>=29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.4"]
# Claude as the cloud second opinion (cloud.provider: anthropic).
claude = ["anthropic>=2.0"]

[project.scripts]
aiops-copilot = "aiops_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiops_copilot = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
