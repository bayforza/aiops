# kube-prometheus-stack, trimmed for a laptop. Local test environment only.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}

grafana:
  adminPassword: admin   # local test cluster only
  service: {type: NodePort, nodePort: 30300}
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc:3100
  # Grafana 13 needs more than 256Mi at startup: at that limit it thrashes its page
  # cache, never becomes healthy and is killed by the liveness probe.
  resources:
    requests: {memory: 256Mi}
    limits: {memory: 640Mi}

prometheus:
  service: {type: NodePort, nodePort: 30090}
  prometheusSpec:
    retention: 6h
    scrapeInterval: 15s
    evaluationInterval: 15s
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: {memory: 400Mi}
      limits: {memory: 1Gi}

alertmanager:
  service: {type: NodePort, nodePort: 30093}
  alertmanagerSpec:
    resources:
      requests: {memory: 32Mi}
      limits: {memory: 64Mi}
  config:
    global: {resolve_timeout: 5m}
    route:
      receiver: aiops-copilot
      group_by: [alertname, namespace, pod]
      group_wait: 20s
      group_interval: 2m
      repeat_interval: 1h
      routes:
        - receiver: "null"
          # Always-firing meta alerts, plus alerts a single-node kind cluster on a laptop
          # raises by itself (clock sync, missed rule evaluations under memory pressure).
          # Sending them to the copilot only produces noise incidents.
          matchers: ['alertname =~ "Watchdog|InfoInhibitor|PrometheusMissingRuleEvaluations|NodeClockNotSynchronising"']
    receivers:
      - name: "null"
      - name: aiops-copilot
        webhook_configs:
          # The copilot runs on the Mac host; Docker Desktop resolves host.docker.internal from pods.
          - url: http://host.docker.internal:8080/webhook/alertmanager
            send_resolved: false

prometheusOperator:
  resources:
    requests: {memory: 64Mi}
    limits: {memory: 128Mi}

kube-state-metrics:
  resources:
    requests: {memory: 32Mi}
    limits: {memory: 128Mi}
