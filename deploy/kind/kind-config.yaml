# Single-node cluster sized for a 16 GB MacBook (Docker Desktop: give it ~6 GB RAM).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aiops
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30090   # Prometheus
        hostPort: 9090
      - containerPort: 30100   # Loki
        hostPort: 3100
      - containerPort: 30300   # Grafana
        hostPort: 3000
      - containerPort: 30093   # Alertmanager
        hostPort: 9093
