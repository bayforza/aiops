# Scenario "config-error": references a ConfigMap that does not exist (CreateContainerConfigError).
# Expected copilot answer: config_error, manual fix only (the copilot never writes config or secrets).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-svc
  namespace: demo
  labels: {app: notification-svc}
spec:
  replicas: 1
  selector:
    matchLabels: {app: notification-svc}
  template:
    metadata:
      labels: {app: notification-svc}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo sending via $SMTP_HOST; sleep 3600"]
          env:
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: smtp_host
          resources:
            requests:
              memory: 8Mi
              cpu: 5m
            limits:
              memory: 32Mi
