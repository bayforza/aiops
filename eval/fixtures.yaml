# Recorded incident contexts with the expected answer.
# The last cases have no clear rule-based signal on purpose: that is where the model must add value.
- name: oom-checkout-cache
  expected_category: oom
  expected_runbook: oom-increase-memory
  workload: checkout-api
  alert:
    labels: {alertname: KubePodOOMKilled, namespace: demo, pod: checkout-api-6f7c9d8b5c-k2x9p, container: app, severity: warning}
    annotations: {summary: Container demo/checkout-api-6f7c9d8b5c-k2x9p (app) OOMKilled}
    startsAt: "2026-11-18T10:00:00Z"
  context:
    containers:
      - {name: app, image: "python:3.12-alpine", ready: false, restart_count: 4, waiting_reason: CrashLoopBackOff,
         last_terminated_reason: OOMKilled, last_exit_code: 137, memory_limit: 64Mi}
    events:
      - "Warning BackOff Pod/checkout-api-6f7c9d8b5c-k2x9p: Back-off restarting failed container app (x6)"
    log_lines:
      - checkout-api starting, loading product cache
      - cache chunk 0 loaded (5 MB)
      - cache chunk 9 loaded (50 MB)
      - cache chunk 11 loaded (60 MB)
    metrics:
      - {name: memory_usage_vs_limit, query: "", last: 0.62, max: 0.99, min: 0.1, unit: ratio}
      - {name: container_restarts, query: "", last: 4, max: 4, min: 0, unit: count/10m}

